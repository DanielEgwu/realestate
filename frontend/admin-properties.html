<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Management | MERD Admin</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .property-card {
            background: var(--white);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .property-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
        }

        .property-header h2 {
            margin-bottom: 6px;
        }

        .property-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .meta-box {
            background: var(--light-blue);
            padding: 12px;
            border-radius: 8px;
        }

        .meta-box small {
            display: block;
            color: var(--gray-medium);
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .status-published {
            background: #d4edda;
            color: #155724;
        }

        .status-draft {
            background: #fff3cd;
            color: #856404;
        }

        .status-archived {
            background: #e2e3e5;
            color: #383d41;
        }

        .featured {
            background: #cce5ff;
            color: #004085;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .details {
            display: none;
            border-top: 1px solid var(--border-gray);
            margin-top: 18px;
            padding-top: 18px;
        }

        .details.show {
            display: block;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .media-item {
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            overflow: hidden;
            background: var(--white);
        }

        .media-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .media-item video {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .media-caption {
            padding: 8px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
        }

        .danger-btn {
            border-color: #dc3545 !important;
            color: #dc3545 !important;
        }

        .danger-btn:hover {
            background: #dc3545 !important;
            color: white !important;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-gray);
            border-radius: 7px;
            font: inherit;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

<header>
    <div class="navbar">

        <div class="navbar-brand">
            🏢 MERD Admin
        </div>

        <div class="navbar-cta">

            <a
                href="admin-dashboard.html"
                class="btn btn-outline">
                Dashboard
            </a>

            <a
                href="admin-submissions.html"
                class="btn btn-outline">
                Submissions
            </a>

            <button
                class="btn btn-secondary"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>
</header>


<main class="container mt-xl mb-xl">

    <div class="page-header">

        <div>

            <h1>Property Management</h1>

            <p class="text-secondary">
                Manage published, draft and archived properties.
            </p>

        </div>

    </div>


    <!-- FILTERS -->

    <div class="filters">

        <button
            class="btn btn-primary"
            onclick="loadProperties()">
            All
        </button>

        <button
            class="btn btn-outline"
            onclick="loadProperties('published')">
            Published
        </button>

        <button
            class="btn btn-outline"
            onclick="loadProperties('draft')">
            Draft
        </button>

        <button
            class="btn btn-outline"
            onclick="loadProperties('archived')">
            Archived
        </button>

    </div>


    <!-- PROPERTY LIST -->

    <div id="propertiesContainer">

        <div class="card empty">
            Loading properties...
        </div>

    </div>

</main>


<!-- EDIT MODAL -->

<div
    id="editModal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Edit Property</h2>

            <button
                class="btn btn-outline"
                onclick="closeEditModal()">
                ✕
            </button>

        </div>


        <form id="editPropertyForm">

            <input
                type="hidden"
                id="editPropertyId">


            <div class="form-group">

                <label for="editTitle">
                    Title
                </label>

                <input
                    type="text"
                    id="editTitle"
                    required>

            </div>


            <div class="form-group">

                <label for="editLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="editLocation"
                    required>

            </div>


            <div class="form-group">

                <label for="editPrice">
                    Price
                </label>

                <input
                    type="number"
                    id="editPrice"
                    min="0"
                    step="0.01"
                    required>

            </div>


            <div class="form-group">

                <label for="editType">
                    Property Type
                </label>

                <input
                    type="text"
                    id="editType"
                    required>

            </div>


            <div class="form-group">

                <label for="editSize">
                    Size
                </label>

                <input
                    type="number"
                    id="editSize"
                    min="0"
                    step="0.01">

            </div>


            <div class="form-group">

                <label for="editDescription">
                    Description
                </label>

                <textarea
                    id="editDescription"
                    rows="5"></textarea>

            </div>


            <div class="form-group">

                <label for="editDocumentation">
                    Documentation Status
                </label>

                <input
                    type="text"
                    id="editDocumentation">

            </div>


            <div class="form-group">

                <label for="editStatus">
                    Status
                </label>

                <select id="editStatus">

                    <option value="published">
                        Published
                    </option>

                    <option value="draft">
                        Draft
                    </option>

                    <option value="archived">
                        Archived
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>

                    <input
                        type="checkbox"
                        id="editFeatured">

                    Featured property

                </label>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-outline"
                    onclick="closeEditModal()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/api.js"></script>
<script src="js/utils.js"></script>


<script>

let currentStatus = '';


// =====================================================
// LOAD PROPERTIES
// =====================================================

async function loadProperties(status = '') {

    currentStatus = status;

    const container =
        document.getElementById(
            'propertiesContainer'
        );

    container.innerHTML = `
        <div class="card empty">
            Loading properties...
        </div>
    `;

    try {

        await requireAuth();


        let endpoint =
            '/admin/properties';


        if (status) {

            endpoint +=
                `?status=${encodeURIComponent(status)}`;

        }


        const properties =
            await api.get(endpoint);


        if (
            !properties ||
            properties.length === 0
        ) {

            container.innerHTML = `
                <div class="card empty">

                    <h3>
                        No properties found
                    </h3>

                    <p class="text-secondary">
                        There are currently no
                        ${status || ''} properties.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            properties
                .map(renderProperty)
                .join('');


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="card empty">

                <h3>
                    Unable to load properties
                </h3>

                <p class="text-secondary">
                    ${escapeHtml(error.message)}
                </p>

            </div>
        `;
    }
}


// =====================================================
// RENDER PROPERTY
// =====================================================

function renderProperty(property) {

    const price =
        property.price != null
            ? formatCurrency(
                Number(property.price)
              )
            : 'Not provided';


    const statusClass =
        `status-${property.status || 'draft'}`;


    return `

        <div class="property-card">

            <div class="property-header">

                <div>

                    <h2>
                        ${escapeHtml(
                            property.title
                        )}
                    </h2>

                    <p class="text-secondary">

                        📍
                        ${escapeHtml(
                            property.location
                        )}

                    </p>

                </div>


                <div>

                    <span
                        class="status ${statusClass}">

                        ${escapeHtml(
                            property.status ||
                            'unknown'
                        )}

                    </span>


                    ${
                        property.featured
                        ?
                        `
                        <span
                            class="status featured">

                            ⭐ Featured

                        </span>
                        `
                        :
                        ''
                    }

                </div>

            </div>


            <div class="property-meta">

                <div class="meta-box">

                    <small>
                        Property Type
                    </small>

                    <strong>
                        ${escapeHtml(
                            property.property_type
                        )}
                    </strong>

                </div>


                <div class="meta-box">

                    <small>
                        Price
                    </small>

                    <strong>
                        ${escapeHtml(price)}
                    </strong>

                </div>


                <div class="meta-box">

                    <small>
                        Size
                    </small>

                    <strong>
                        ${escapeHtml(
                            property.size ||
                            'Not provided'
                        )}
                    </strong>

                </div>


                <div class="meta-box">

                    <small>
                        Created
                    </small>

                    <strong>
                        ${formatDate(
                            property.created_at
                        )}
                    </strong>

                </div>

            </div>


            <div class="actions">

                <button
                    class="btn btn-outline"
                    onclick="toggleDetails(
                        ${property.id}
                    )">

                    View Details

                </button>


                <button
                    class="btn btn-outline"
                    onclick="openEditModal(
                        ${property.id}
                    )">

                    Edit

                </button>


                <button
                    class="btn btn-outline"
                    onclick="toggleFeatured(
                        ${property.id},
                        ${!property.featured}
                    )">

                    ${
                        property.featured
                        ? 'Remove Featured'
                        : 'Make Featured'
                    }

                </button>


                <button
                    class="btn btn-outline danger-btn"
                    onclick="deleteProperty(
                        ${property.id}
                    )">

                    Delete

                </button>

            </div>


            <div
                id="details-${property.id}"
                class="details">

                <div class="details-grid">

                    <div>

                        <strong>
                            Documentation
                        </strong>

                        <p>
                            ${escapeHtml(
                                property.documentation_status ||
                                'Not provided'
                            )}
                        </p>

                    </div>


                    <div>

                        <strong>
                            Updated
                        </strong>

                        <p>
                            ${formatDate(
                                property.updated_at
                            )}
                        </p>

                    </div>

                </div>


                <div>

                    <strong>
                        Description
                    </strong>

                    <p>
                        ${escapeHtml(
                            property.description ||
                            'Not provided'
                        )}
                    </p>

                </div>


                <div
                    id="media-${property.id}">

                    <p class="text-secondary">
                        Loading media...
                    </p>

                </div>

            </div>

        </div>

    `;
}


// =====================================================
// VIEW DETAILS + MEDIA
// =====================================================

async function toggleDetails(id) {

    const details =
        document.getElementById(
            `details-${id}`
        );

    if (!details) return;


    const isOpen =
        details.classList.contains('show');


    details.classList.toggle('show');


    if (!isOpen) {

        await loadPropertyMedia(id);

    }

}


// =====================================================
// LOAD PROPERTY MEDIA
// =====================================================

async function loadPropertyMedia(id) {

    const container =
        document.getElementById(
            `media-${id}`
        );

    if (!container) return;


    try {

        const property =
            await api.get(
                `/admin/properties/${id}`
            );


        const images =
            property.images || [];


        const videos =
            property.videos || [];


        let html = '';


        if (images.length > 0) {

            html += `
                <h4>
                    Photos
                </h4>

                <div class="media-grid">

                    ${images.map(image => `

                        <div class="media-item">

                            <img
                                src="${escapeHtml(
                                    getMediaUrl(
                                        image.image_url
                                    )
                                )}"
                                alt="Property image"
                                loading="lazy">

                            ${
                                image.caption
                                ?
                                `
                                <div class="media-caption">

                                    ${escapeHtml(
                                        image.caption
                                    )}

                                </div>
                                `
                                :
                                ''
                            }

                        </div>

                    `).join('')}

                </div>
            `;

        }


        if (videos.length > 0) {

            html += `
                <h4 style="margin-top:20px;">
                    Videos
                </h4>

                <div class="media-grid">

                    ${videos.map(video => `

                        <div class="media-item">

                            <video
                                controls>

                                <source
                                    src="${escapeHtml(
                                        getMediaUrl(
                                            video.video_url
                                        )
                                    )}">

                                Your browser does not
                                support video playback.

                            </video>

                            ${
                                video.title
                                ?
                                `
                                <div class="media-caption">

                                    ${escapeHtml(
                                        video.title
                                    )}

                                </div>
                                `
                                :
                                ''
                            }

                        </div>

                    `).join('')}

                </div>
            `;

        }


        if (!html) {

            html = `
                <p class="text-secondary">
                    No photos or videos attached.
                </p>
            `;

        }


        container.innerHTML = html;


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <p class="text-secondary">
                Unable to load property media.
            </p>
        `;
    }
}


// =====================================================
// MEDIA URL
// =====================================================

function getMediaUrl(url) {

    if (!url) return '';


    // Already an absolute URL
    if (
        url.startsWith('http://') ||
        url.startsWith('https://')
    ) {

        return url;

    }


    // Convert Windows filesystem path
    // into a server-relative upload path

    const normalized =
        url.replace(/\\/g, '/');


    const uploadsIndex =
        normalized.indexOf('/uploads/');


    if (uploadsIndex !== -1) {

        return normalized.substring(
            uploadsIndex
        );

    }


    return normalized;

}


// =====================================================
// EDIT PROPERTY
// =====================================================

async function openEditModal(id) {

    try {

        const property =
            await api.get(
                `/admin/properties/${id}`
            );


        document.getElementById(
            'editPropertyId'
        ).value = property.id;


        document.getElementById(
            'editTitle'
        ).value =
            property.title || '';


        document.getElementById(
            'editLocation'
        ).value =
            property.location || '';


        document.getElementById(
            'editPrice'
        ).value =
            property.price || '';


        document.getElementById(
            'editType'
        ).value =
            property.property_type || '';


        document.getElementById(
            'editSize'
        ).value =
            property.size || '';


        document.getElementById(
            'editDescription'
        ).value =
            property.description || '';


        document.getElementById(
            'editDocumentation'
        ).value =
            property.documentation_status || '';


        document.getElementById(
            'editStatus'
        ).value =
            property.status || 'published';


        document.getElementById(
            'editFeatured'
        ).checked =
            Boolean(property.featured);


        document.getElementById(
            'editModal'
        ).classList.add('show');


    } catch (error) {

        console.error(error);

        showNotification(
            'Failed to load property.',
            'danger'
        );

    }

}


function closeEditModal() {

    document.getElementById(
        'editModal'
    ).classList.remove('show');

}


// =====================================================
// SAVE PROPERTY
// =====================================================

document.getElementById(
    'editPropertyForm'
).addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();


        const id =
            document.getElementById(
                'editPropertyId'
            ).value;


        try {

            await api.patch(
                `/admin/properties/${id}`,
                {
                    title:
                        document.getElementById(
                            'editTitle'
                        ).value.trim(),

                    location:
                        document.getElementById(
                            'editLocation'
                        ).value.trim(),

                    price:
                        Number(
                            document.getElementById(
                                'editPrice'
                            ).value
                        ),

                    propertyType:
                        document.getElementById(
                            'editType'
                        ).value.trim(),

                    size:
                        document.getElementById(
                            'editSize'
                        ).value
                        ?
                        Number(
                            document.getElementById(
                                'editSize'
                            ).value
                        )
                        :
                        null,

                    description:
                        document.getElementById(
                            'editDescription'
                        ).value.trim(),

                    documentationStatus:
                        document.getElementById(
                            'editDocumentation'
                        ).value.trim(),

                    status:
                        document.getElementById(
                            'editStatus'
                        ).value,

                    featured:
                        document.getElementById(
                            'editFeatured'
                        ).checked
                }
            );


            closeEditModal();


            showNotification(
                'Property updated successfully.',
                'success'
            );


            loadProperties(
                currentStatus
            );


        } catch (error) {

            console.error(error);

            showNotification(
                'Failed to update property.',
                'danger'
            );

        }

    }
);


// =====================================================
// FEATURED
// =====================================================

async function toggleFeatured(
    id,
    featured
) {

    try {

        await api.patch(
            `/admin/properties/${id}`,
            {
                featured
            }
        );


        showNotification(
            featured
                ? 'Property marked as featured.'
                : 'Property removed from featured.',
            'success'
        );


        loadProperties(
            currentStatus
        );


    } catch (error) {

        console.error(error);

        showNotification(
            'Failed to update featured status.',
            'danger'
        );

    }

}


// =====================================================
// DELETE PROPERTY
// =====================================================

async function deleteProperty(id) {

    const confirmed =
        confirm(
            'Are you sure you want to delete this property? This action cannot be undone.'
        );


    if (!confirmed) return;


    try {

        await api.delete(
            `/admin/properties/${id}`
        );


        showNotification(
            'Property deleted successfully.',
            'success'
        );


        loadProperties(
            currentStatus
        );


    } catch (error) {

        console.error(error);

        showNotification(
            'Failed to delete property.',
            'danger'
        );

    }

}


// =====================================================
// DATE FORMAT
// =====================================================

function formatDate(date) {

    if (!date) {
        return 'Not available';
    }


    try {

        return new Date(date)
            .toLocaleDateString(
                'en-NG',
                {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                }
            );

    } catch {

        return String(date);

    }

}


// =====================================================
// HTML ESCAPING
// =====================================================

function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


// =====================================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// =====================================================

document.getElementById(
    'editModal'
).addEventListener(
    'click',
    function(event) {

        if (
            event.target === this
        ) {

            closeEditModal();

        }

    }
);


// =====================================================
// START
// =====================================================

document.addEventListener(
    'DOMContentLoaded',
    () => loadProperties()
);

</script>

</body>
</html>
