<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - MERD Landmark Properties</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navigation -->
  <header>
    <div class="navbar">
      <div class="navbar-brand">🏢 MERD Admin</div>
    </div>
  </header>

  <!-- Login Form -->
  <div class="container-sm mt-xl" style="max-width: 400px;">
    <div class="card">
      <div class="card-header" style="text-align: center;">Admin Login</div>
      <form id="loginForm" class="card-body">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="admin@merdlandmark.com" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        
        <p class="text-secondary" style="font-size: 0.9rem; margin-top: 1rem; text-align: center;">
          Contact your administrator if you don't have login credentials
        </p>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        showNotification('Please enter email and password', 'warning');
        return;
      }
      
      try {
        const submitBtn = document.querySelector('button[type="submit"]');
        setLoading(submitBtn);
        
        const response = await api.post('/auth/login', { email, password });
        
        storage.setToken(response.token);
        showNotification('Login successful', 'success');
        
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1000);
      } catch (error) {
        showNotification('Login failed: ' + error.message, 'danger');
      } finally {
        setLoading(document.querySelector('button[type="submit"]'), false);
      }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', handleLogin);
      }
    });
  </script>
</body>
</html>
