<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiries | MERD Admin</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-box {
            margin-bottom: 20px;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            font: inherit;
        }

        .enquiry-card {
            background: var(--white);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .enquiry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
        }

        .enquiry-header h2 {
            margin-bottom: 5px;
        }

        .enquiry-meta {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .meta-box {
            background: var(--light-blue);
            padding: 12px;
            border-radius: 8px;
        }

        .meta-box small {
            display: block;
            color: var(--gray-medium);
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .status-new {
            background: #cce5ff;
            color: #004085;
        }

        .status-contacted {
            background: #fff3cd;
            color: #856404;
        }

        .status-resolved {
            background: #d4edda;
            color: #155724;
        }

        .status-closed {
            background: #e2e3e5;
            color: #383d41;
        }

        .details {
            display: none;
            border-top: 1px solid var(--border-gray);
            margin-top: 18px;
            padding-top: 18px;
        }

        .details.show {
            display: block;
        }

        .message-box {
            background: var(--light-blue);
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            margin: 15px 0;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
        }

        .danger-btn {
            border-color: #dc3545 !important;
            color: #dc3545 !important;
        }

        .danger-btn:hover {
            background: #dc3545 !important;
            color: white !important;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-gray);
            border-radius: 7px;
            font: inherit;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

<header>

    <div class="navbar">

        <div class="navbar-brand">
            🏢 MERD Admin
        </div>

        <div class="navbar-cta">

            <a
                href="admin-dashboard.html"
                class="btn btn-outline">
                Dashboard
            </a>

            <a
                href="admin-properties.html"
                class="btn btn-outline">
                Properties
            </a>

            <a
                href="admin-buyers.html"
                class="btn btn-outline">
                Buyers
            </a>

            <button
                class="btn btn-secondary"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>

</header>


<main class="container mt-xl mb-xl">

    <div class="page-header">

        <div>

            <h1>Enquiries & Contact Requests</h1>

            <p class="text-secondary">
                Manage messages and enquiries submitted through
                the MERD website.
            </p>

        </div>

    </div>


    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="Search name, email, phone or subject..."
            oninput="filterEnquiries()">

    </div>


    <div class="filters">

        <button
            class="btn btn-primary"
            onclick="loadEnquiries()">
            All
        </button>

        <button
            class="btn btn-outline"
            onclick="loadEnquiries('new')">
            New
        </button>

        <button
            class="btn btn-outline"
            onclick="loadEnquiries('contacted')">
            Contacted
        </button>

        <button
            class="btn btn-outline"
            onclick="loadEnquiries('resolved')">
            Resolved
        </button>

        <button
            class="btn btn-outline"
            onclick="loadEnquiries('closed')">
            Closed
        </button>

    </div>


    <div id="enquiriesContainer">

        <div class="card empty">
            Loading enquiries...
        </div>

    </div>

</main>


<!-- EDIT MODAL -->

<div
    id="editModal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Update Enquiry</h2>

            <button
                class="btn btn-outline"
                onclick="closeEditModal()">
                ✕
            </button>

        </div>


        <form id="editEnquiryForm">

            <input
                type="hidden"
                id="editEnquiryId">


            <div class="form-group">

                <label for="editStatus">
                    Status
                </label>

                <select id="editStatus">

                    <option value="new">
                        New
                    </option>

                    <option value="contacted">
                        Contacted
                    </option>

                    <option value="resolved">
                        Resolved
                    </option>

                    <option value="closed">
                        Closed
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="editNotes">
                    Internal Notes
                </label>

                <textarea
                    id="editNotes"
                    rows="6"
                    placeholder="Add private notes for the MERD team..."></textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-outline"
                    onclick="closeEditModal()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/api.js"></script>
<script src="js/utils.js"></script>


<script>

let allEnquiries = [];

let currentStatus = '';


// =====================================================
// LOAD ENQUIRIES
// =====================================================

async function loadEnquiries(status = '') {

    currentStatus = status;

    const container =
        document.getElementById(
            'enquiriesContainer'
        );


    container.innerHTML = `
        <div class="card empty">
            Loading enquiries...
        </div>
    `;


    try {

        await requireAuth();


        let endpoint =
            '/admin/enquiries';


        if (status) {

            endpoint +=
                `?status=${encodeURIComponent(status)}`;

        }


        const enquiries =
            await api.get(endpoint);


        allEnquiries =
            Array.isArray(enquiries)
                ? enquiries
                : [];


        renderEnquiries(
            allEnquiries
        );


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="card empty">

                <h3>
                    Unable to load enquiries
                </h3>

                <p class="text-secondary">
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>
        `;

    }

}


// =====================================================
// RENDER
// =====================================================

function renderEnquiries(
    enquiries
) {

    const container =
        document.getElementById(
            'enquiriesContainer'
        );


    if (
        !enquiries ||
        enquiries.length === 0
    ) {

        container.innerHTML = `
            <div class="card empty">

                <h3>
                    No enquiries found
                </h3>

                <p class="text-secondary">
                    There are currently no enquiries
                    matching this filter.
                </p>

            </div>
        `;

        return;

    }


    container.innerHTML =
        enquiries
            .map(renderEnquiry)
            .join('');

}


// =====================================================
// ENQUIRY CARD
// =====================================================

function renderEnquiry(
    enquiry
) {

    const status =
        enquiry.status || 'new';


    return `

        <div class="enquiry-card">

            <div class="enquiry-header">

                <div>

                    <h2>
                        ${escapeHtml(
                            enquiry.subject ||
                            'General Enquiry'
                        )}
                    </h2>

                    <p class="text-secondary">

                        From:
                        ${escapeHtml(
                            enquiry.name
                        )}

                    </p>

                </div>


                <span
                    class="status status-${escapeHtml(
                        status
                    )}">

                    ${escapeHtml(
                        status
                    )}

                </span>

            </div>


            <div class="enquiry-meta">

                <div class="meta-box">

                    <small>
                        Name
                    </small>

                    <strong>
                        ${escapeHtml(
                            enquiry.name
                        )}
                    </strong>

                </div>


                <div class="meta-box">

                    <small>
                        Email
                    </small>

                    <strong>
                        ${escapeHtml(
                            enquiry.email
                        )}
                    </strong>

                </div>


                <div class="meta-box">

                    <small>
                        Phone
                    </small>

                    <strong>
                        ${escapeHtml(
                            enquiry.phone ||
                            'Not provided'
                        )}
                    </strong>

                </div>


                <div class="meta-box">

                    <small>
                        Type
                    </small>

                    <strong>
                        ${escapeHtml(
                            enquiry.enquiry_type ||
                            'General'
                        )}
                    </strong>

                </div>


                <div class="meta-box">

                    <small>
                        Received
                    </small>

                    <strong>
                        ${formatDate(
                            enquiry.created_at
                        )}
                    </strong>

                </div>

            </div>


            <div class="actions">

                <button
                    class="btn btn-outline"
                    onclick="toggleDetails(
                        ${enquiry.id}
                    )">

                    View Message

                </button>


                <button
                    class="btn btn-outline"
                    onclick="openEditModal(
                        ${enquiry.id}
                    )">

                    Update

                </button>


                <button
                    class="btn btn-outline danger-btn"
                    onclick="deleteEnquiry(
                        ${enquiry.id}
                    )">

                    Delete

                </button>

            </div>


            <div
                id="details-${enquiry.id}"
                class="details">


                <h4>
                    Message
                </h4>


                <div class="message-box">

                    ${escapeHtml(
                        enquiry.message ||
                        'No message provided.'
                    )}

                </div>


                <h4>
                    Contact
                </h4>


                <div class="actions">

                    ${
                        enquiry.phone
                        ?
                        `
                        <a
                            href="tel:${escapeHtml(
                                enquiry.phone
                            )}"
                            class="btn btn-outline">

                            📞 Call

                        </a>
                        `
                        :
                        ''
                    }


                    ${
                        enquiry.email
                        ?
                        `
                        <a
                            href="mailto:${escapeHtml(
                                enquiry.email
                            )}"
                            class="btn btn-outline">

                            ✉️ Email

                        </a>
                        `
                        :
                        ''
                    }

                </div>


                <div style="margin-top:20px;">

                    <strong>
                        Internal Notes
                    </strong>

                    <p>
                        ${escapeHtml(
                            enquiry.internal_notes ||
                            'No internal notes.'
                        )}
                    </p>

                </div>

            </div>

        </div>

    `;

}


// =====================================================
// TOGGLE DETAILS
// =====================================================

function toggleDetails(
    id
) {

    const element =
        document.getElementById(
            `details-${id}`
        );


    if (element) {

        element.classList.toggle(
            'show'
        );

    }

}


// =====================================================
// SEARCH
// =====================================================

function filterEnquiries() {

    const search =
        document.getElementById(
            'searchInput'
        )
        .value
        .trim()
        .toLowerCase();


    if (!search) {

        renderEnquiries(
            allEnquiries
        );

        return;

    }


    const filtered =
        allEnquiries.filter(
            enquiry => {

                return [

                    enquiry.name,

                    enquiry.email,

                    enquiry.phone,

                    enquiry.subject,

                    enquiry.enquiry_type,

                    enquiry.status

                ]
                .some(
                    value =>
                        String(
                            value || ''
                        )
                        .toLowerCase()
                        .includes(search)
                );

            }
        );


    renderEnquiries(
        filtered
    );

}


// =====================================================
// OPEN EDIT MODAL
// =====================================================

async function openEditModal(
    id
) {

    try {

        const enquiry =
            await api.get(
                `/admin/enquiries/${id}`
            );


        document.getElementById(
            'editEnquiryId'
        ).value =
            enquiry.id;


        document.getElementById(
            'editStatus'
        ).value =
            enquiry.status || 'new';


        document.getElementById(
            'editNotes'
        ).value =
            enquiry.internal_notes || '';


        document.getElementById(
            'editModal'
        ).classList.add(
            'show'
        );


    } catch (error) {

        console.error(error);

        showNotification(
            'Failed to load enquiry.',
            'danger'
        );

    }

}


// =====================================================
// CLOSE MODAL
// =====================================================

function closeEditModal() {

    document.getElementById(
        'editModal'
    ).classList.remove(
        'show'
    );

}


// =====================================================
// SAVE CHANGES
// =====================================================

document.getElementById(
    'editEnquiryForm'
).addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();


        const id =
            document.getElementById(
                'editEnquiryId'
            ).value;


        try {

            await api.patch(

                `/admin/enquiries/${id}`,

                {

                    status:
                        document.getElementById(
                            'editStatus'
                        ).value,

                    internalNotes:
                        document.getElementById(
                            'editNotes'
                        ).value.trim()

                }

            );


            closeEditModal();


            showNotification(
                'Enquiry updated successfully.',
                'success'
            );


            loadEnquiries(
                currentStatus
            );


        } catch (error) {

            console.error(error);

            showNotification(
                'Failed to update enquiry.',
                'danger'
            );

        }

    }
);


// =====================================================
// DELETE
// =====================================================

async function deleteEnquiry(
    id
) {

    const confirmed =
        confirm(
            'Are you sure you want to delete this enquiry? This action cannot be undone.'
        );


    if (!confirmed) return;


    try {

        await api.delete(
            `/admin/enquiries/${id}`
        );


        showNotification(
            'Enquiry deleted successfully.',
            'success'
        );


        loadEnquiries(
            currentStatus
        );


    } catch (error) {

        console.error(error);

        showNotification(
            'Failed to delete enquiry.',
            'danger'
        );

    }

}


// =====================================================
// DATE
// =====================================================

function formatDate(
    date
) {

    if (!date) {
        return 'Not available';
    }


    try {

        return new Date(date)
            .toLocaleDateString(
                'en-NG',
                {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                }
            );

    } catch {

        return String(date);

    }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
    value
) {

    return String(value ?? '')
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}


// =====================================================
// MODAL OUTSIDE CLICK
// =====================================================

document.getElementById(
    'editModal'
).addEventListener(
    'click',
    function(event) {

        if (
            event.target === this
        ) {

            closeEditModal();

        }

    }
);


// =====================================================
// START
// =====================================================

document.addEventListener(
    'DOMContentLoaded',
    loadEnquiries
);

</script>

</body>
</html>
